[package]
name = "inference-bench-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless OpenAI-compatible inference server for inference-bench"

[lib]
name = "inference_bench_server"

[[bin]]
name = "inference-bench-server"
path = "src/main.rs"

[features]
default = ["tls"]
tls = ["dep:axum-server", "dep:rustls"]

[dependencies]
inference-bench-core.workspace = true
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path"] }
axum-server = { version = "0.7", optional = true, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
chrono.workspace = true
clap.workspace = true
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ureq.workspace = true
tracing-subscriber.workspace = true
