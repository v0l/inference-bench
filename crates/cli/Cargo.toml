[package]
name = "inference-bench-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "inference-bench"
path = "src/main.rs"

[package.metadata.deb]
name = "inference-bench"
maintainer = "v0l <kieran@harkin.me>"
copyright = "v0l"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Inference Bench runs LLMs on its own spec-driven CUDA engine, with a model library, \
chat and an OpenAI-compatible API server. \
Ships the inference-bench command line tool and the inference-bench-ui desktop application."""
assets = [
    ["target/release/inference-bench", "usr/bin/", "755"],
    ["target/release/inference-bench-ui", "usr/bin/", "755"],
    ["../../packaging/linux/inference-bench.desktop", "usr/share/applications/", "644"],
    ["../ui/assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/inference-bench.png", "644"],
    ["../../README.md", "usr/share/doc/inference-bench/README.md", "644"],
]

[dependencies]
inference-bench-core.workspace = true
inference-bench-server = { path = "../server" }
tracing.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
chrono.workspace = true
