[package]
name = "inference-bench-kir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kernel IR: typed kernel descriptions with CUDA and WGSL source emitters"

[lib]
name = "kir"

[dependencies]
serde.workspace = true
toml.workspace = true

[features]
default = ["cuda", "wgsl"]
cuda = []
wgsl = []

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
