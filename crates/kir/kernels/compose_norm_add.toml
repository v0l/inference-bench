kind = "kir-kernel"
family = "compose"
name = "norm_add"
threads = 1024

[args]
width = "hidden"

[rows]
iter = "block"
address = "base"
per_row = ["delta", "resid", "out"]

[[param]]
name = "delta"
role = "activation"
access = "read"

[[param]]
name = "weight"
role = "weight"
access = "read"

[[param]]
name = "resid"
role = "activation"
access = "read"

[[param]]
name = "out"
role = "activation"
access = "write"

[[const]]
name = "eps"
value = "norm_eps"
wgsl_const = true

[[const]]
name = "offset"
value = 0
fold = true

[[stage]]
op = "tile_load"
name = "d"
src = "delta"

[[stage]]
op = "block_sum"
name = "total"
expr = "d * d"

[[stage]]
op = "epilogue"
name = "inv"
expr = "rsqrt(total / width + eps)"

[[stage]]
op = "tile_load"
name = "w"
src = "weight"

[[stage]]
op = "tile_load"
name = "r"
src = "resid"

[[stage]]
op = "epilogue"
name = "y"
expr = "r + (w + offset) * (d * inv)"

[[stage]]
op = "tile_store"
dst = "out"
value = "y"
