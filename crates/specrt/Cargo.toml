[package]
name = "inference-bench-specrt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Spec-driven CUDA runtime for dense decoder models: a new model is a TOML file"

[lib]
name = "specrt"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "1", optional = true }
anyhow.workspace = true
getrandom = "0.3"
ureq.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
inference-bench-kir = { path = "../kir" }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
dirs.workspace = true
memmap2 = "0.9"
libc = "0.2"
safetensors = "0.7"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
mdns-sd = "0.21"
if-addrs = "0.15"
spake2 = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
openh264 = "0.9"
base64 = "0.22"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["json", "serde_json", "preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
fancy-regex = "0.17"

[target.'cfg(any(windows, unix))'.dependencies]
libloading = "0.8"

[dev-dependencies]
inference-bench-kir = { path = "../kir", features = ["test-text"] }
