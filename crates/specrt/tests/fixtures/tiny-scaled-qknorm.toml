name = "tiny-scaled-qknorm"
repo = "tests/fixtures/tiny-scaled-qknorm"
quant = "bf16"
plain_activations = true

[dims]
hidden = 128
intermediate = 256
vocab = 512
tie_embeddings = true
embed_scale = 12.0
logit_scale = 0.125

[layers]
count = 4
pattern = ["dense"]

[norm]
kind = "rmsnorm"
eps = 0.000001
residual_scale = 0.22

[attention]
kind = "gqa"
heads = 4
kv_heads = 2
head_dim = 32
qkv_bias = false
qk_norm = true
qk_norm_full = true
query_scalar = 64.0

[rope]
style = "neox"
theta = 10000000.0

[mlp]
activation = "swiglu"
