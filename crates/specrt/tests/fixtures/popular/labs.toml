[machine]
nvme_paths = ["~", "/mnt/data"]
host_share = 0.75
host_bandwidth_gbs = 50.0
cards = 2
card_gib = 96.0

[selection]
months = 9
limit = 400
pipelines = ["text-generation", "image-text-to-text", "any-to-any"]
exclude = "(?i)(OCR|Embed|Rerank|Transcribe|ASR|TTS|Image|Video|Guard|Voxtral|Timestral|LIDstral|SCAIL|Kaleido|SSVAE|eagle|dflash|dspark|draft|assistant|GGUF|ONNX|litert|mobile|qat|Diffusers|Diarization|Parse|Music|Audio|VoiceChat|Foley|3D|World|Nomas|Sports|Cosmos|GR00T|Metatron|MotionBricks|SAE-|Aligner|Proteina|Kimodo|colembed|WeMM|Reward|GenRM|Safety|mcore|Flamingo|Sigma|Teacher|tokenizer|MTP|-Vision-Exp|-pytorch|-keras|-flax|-tf|-jax)"
quantised = "(?i)(fp8|nvfp4|mxfp4|mxfp8|awq|gptq|int4|int8|w4a16|w8a8|bnb|fp4|LiLiCorr)"

[[lab]]
key = "zai"
name = "Z.ai"
orgs = ["zai-org"]
search = ["GLM"]
pattern = "^GLM-"
current = "^GLM-4\\.5-Air$|^GLM-4\\.7-Flash$"

[[lab]]
key = "deepseek"
name = "DeepSeek"
orgs = ["deepseek-ai"]
search = ["DeepSeek"]
pattern = "^DeepSeek-(V|R1|Prover|Math)"
current = "^DeepSeek-V3\\.2$|^DeepSeek-V3\\.1$|^DeepSeek-R1-0528$|^DeepSeek-V2-Lite|^DeepSeek-R1-Distill-Qwen-1\\.5B$"

[[lab]]
key = "kimi"
name = "Kimi"
orgs = ["moonshotai"]
search = ["Kimi", "Moonlight"]
pattern = "^(Kimi-(K|Linear|Dev)|Moonlight)"
current = "^Kimi-K2-Instruct-0905$|^Kimi-Linear-48B-A3B-Instruct$"

[[lab]]
key = "tencent"
name = "Tencent"
orgs = ["tencent"]
search = ["Hy", "Hunyuan"]
pattern = "^(Hy4|Hy-Memory|Hunyuan-(A13B|7B|4B|1\\.8B|0\\.5B))"
current = "^Hunyuan-A13B-Instruct$|^Hunyuan-7B-Instruct$"

[[lab]]
key = "xiaomi"
name = "Xiaomi"
orgs = ["XiaomiMiMo"]
search = ["MiMo"]
pattern = "^MiMo-(V2|7B)"
current = "^MiMo-7B-RL$"

[[lab]]
key = "minimax"
name = "MiniMax"
orgs = ["MiniMaxAI"]
search = ["MiniMax"]
pattern = "^MiniMax-(M|Text)"
current = "^MiniMax-M2$|^MiniMax-M1-80k$"

[[lab]]
key = "alibaba"
name = "Alibaba"
orgs = ["Qwen"]
search = ["Qwen3", "Qwen-Agent", "Qwen-Drive"]
pattern = "^Qwen(3|-Agent|-Drive)"
current = "^Qwen3-(0\\.6B|1\\.7B|4B|8B|14B|32B|30B-A3B|235B-A22B)(-Instruct-2507|-Thinking-2507)?$|^Qwen3-Next-80B-A3B-(Instruct|Thinking)$|^Qwen3-Coder-(Next|30B-A3B-Instruct|480B-A35B-Instruct)$"

[[lab]]
key = "mistral"
name = "Mistral"
orgs = ["mistralai"]
search = ["Mistral", "Ministral", "Devstral", "Magistral", "Leanstral"]
pattern = "^(Mistral-(Large|Medium|Small)|Ministral|Devstral|Magistral|Leanstral|Shieldstral)"
current = "^Mistral-Small-3\\.2-24B-Instruct-2506$|^Magistral-Small-2509$|^Devstral-Small-2-24B-Instruct-2512$|^Ministral-3-(3B|8B|14B)-(Instruct|Reasoning|Base)-2512$|^Mistral-Large-3-675B-Instruct-2512$"

[[lab]]
key = "thinkingmachines"
name = "Thinking Machines"
orgs = ["thinkingmachines"]
search = ["Inkling", "TML"]
pattern = "^(Inkling|TML-)"
current = "^Inkling"

  [[lab.absent]]
  name = "Inkling 2 (full)"
  note = "no public repo: thinkingmachines lists Inkling-2-Mini and Inkling-2-Small only"

[[lab]]
key = "meta"
name = "Meta"
orgs = ["meta-llama"]
search = ["Llama-4", "Llama-3"]
pattern = "^Llama-(4|3)"
current = "^Llama-4-(Scout|Maverick)-17B-(16E|128E)(-Instruct)?$|^Llama-3\\.3-70B-Instruct$|^Llama-3\\.2-(1B|3B)(-Instruct)?$|^Llama-3\\.1-(8B|70B|405B)(-Instruct)?$"

[[lab]]
key = "nvidia"
name = "NVIDIA"
orgs = ["nvidia"]
search = ["Nemotron"]
pattern = "Nemotron"
current = "Nemotron-H-|Nemotron-Nano-(9B|12B)-v2$|Nemotron-3-Nano-30B-A3B-BF16$|Nemotron-Super-49B-v1_5$|Nemotron-Ultra-253B-v1$|Llama-3\\.1-Nemotron-Nano-8B-v1$|Llama-3\\.1-Nemotron-70B-Instruct-HF$"

[[lab]]
key = "google"
name = "Google"
orgs = ["google"]
search = ["gemma-4", "gemma-2"]
pattern = "^gemma-(4|2)-"
current = "^gemma-4-(E2B|E4B|12B|26B-A4B|31B)(-it)?$|^gemma-2-(2b|9b|27b)(-it)?$"
note = "Gemma 3 dense (1B, 4B, 12B, 27B, 270m) loads today and Gemma 3n is the `model_type gemma3n` gap on #1214. Gemma 2 is still documented and downloadable from Google (gemma.ai/models/gemma-2/, listed under Previous Gemma models beside Gemma 3), so its `model_type gemma2` gap is split out of #1203 into its own issue; opt, gpt_neox and bloom stay parked in #1203."

[[lab]]
key = "inclusionai"
name = "inclusionAI (secondary)"
orgs = ["inclusionAI"]
search = ["Ling-3.1", "LingSante-3.1"]
pattern = "^Ling(Sante)?-3\\.1"
current = "^$"

[[lab]]
key = "ifm"
name = "IFM (secondary)"
orgs = ["IFM"]
search = ["K2-Horizon"]
pattern = "^K2-Horizon"
current = "^$"

[[lab]]
key = "reflection"
name = "Reflection (secondary)"
orgs = ["reflection"]
search = ["Beam"]
pattern = "^Beam-1\\.0"
current = "^$"
