name = "tiny-sandwich-scaled"
repo = "tests/fixtures/tiny-sandwich-scaled"
quant = "bf16"

[dims]
hidden = 128
intermediate = 256
vocab = 512
tie_embeddings = false

[layers]
count = 4
pattern = ["dense"]

[norm]
kind = "rmsnorm"
eps = 0.000001
sandwich = true
pre = false
residual_scale = 0.22

[attention]
kind = "gqa"
heads = 4
kv_heads = 2
head_dim = 32
qkv_bias = false
qk_norm = true
qk_norm_full = true

[rope]
style = "neox"
theta = 500000.0

[mlp]
activation = "swiglu"
