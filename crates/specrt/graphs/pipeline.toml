name = "pipeline"
kind = "pipeline-graph"

[[pipeline]]
name = "flow-euler"
classes = ["Flux2KleinPipeline"]
schedulers = ["FlowMatchEulerDiscreteScheduler"]
prompt = "chat"
pad_keys = "masked"
text_layers = ["floor(layers / 4)", "floor(layers / 2)", "floor(3 * layers / 4)"]
max_length = 512
steps = "select(distilled, 4, 50)"
guidance = "select(distilled, 1, 4)"
cfg = "guidance > 1 && distilled == 0"
symbols = [
  ["vae_scale", "floor(exp((vae_levels - 1) * log(2)) + 0.5)"],
  ["pixel_step", "vae_scale * latent_patch"],
  ["token_channels", "latent_channels * latent_patch * latent_patch"],
]

[pipeline.fields]
distilled = ["pipeline.is_distilled"]
layers = ["text_encoder.num_hidden_layers"]
train_steps = ["scheduler.num_train_timesteps"]
dynamic = ["scheduler.use_dynamic_shifting"]
static_shift = ["scheduler.shift"]
bn_eps = ["vae.batch_norm_eps"]
latent_patch = ["vae.patch_size.0"]
latent_channels = ["vae.latent_channels"]
vae_levels = ["vae.block_out_channels"]

[pipeline.defaults]
distilled = 0
dynamic = 0
static_shift = 1
bn_eps = 0.0001
latent_patch = 1
vae_levels = 1


[pipeline.tensors]
bn_var = "bn.running_var"
bn_mean = "bn.running_mean"

[pipeline.schedule]
request = [
  ["m200", "0.00016927 * image_tokens + 0.45666666"],
  ["m10", "8.73809524e-05 * image_tokens + 1.89833333"],
  ["mu", "select(image_tokens > 4300, m200, m200 + (m200 - m10) / 190 * (steps - 200))"],
]
step = [
  ["base", "1 - k * (1 - 1 / steps) / max(steps - 1, 1)"],
  ["sigma", "select(dynamic, exp(mu) / (exp(mu) + 1 / base - 1), static_shift * base / (1 + (static_shift - 1) * base))"],
]
last = "0"
model_timestep = "s0"

[pipeline.step]
update = "x + (s1 - s0) * v"
combine = "u + g * (c - u)"
latent_in = "x * sqrt(bn_var + bn_eps) + bn_mean"
output = "min(max(x / 2 + 0.5, 0), 1)"

[pipeline.options]
offload_text_encoder = true
offload_vae = false

[[pipeline]]
name = "unipc"
classes = ["WanPipeline"]
schedulers = ["UniPCMultistepScheduler"]
prompt = "plain"
pad_keys = "zeroed"
encoder = "graph"
text_layers = []
max_length = 512
steps = 50
guidance = 5
cfg = "guidance > 1"
latent = "grid"
symbols = [
  ["vae_scale", "spatial_scale"],
  ["pixel_step", "vae_scale * latent_patch"],
  ["token_channels", "latent_channels"],
]

[pipeline.require]
"scheduler.solver_type" = "bh2"
"scheduler.prediction_type" = "flow_prediction"
"scheduler.use_flow_sigmas" = "true"
"scheduler.predict_x0" = "true"
"scheduler.timestep_spacing" = "linspace"
"scheduler.final_sigmas_type" = "zero"
"scheduler.use_dynamic_shifting" = "false"

[pipeline.fields]
train_steps = ["scheduler.num_train_timesteps"]
flow_shift = ["scheduler.flow_shift"]
order = ["scheduler.solver_order"]
lower_order_final = ["scheduler.lower_order_final"]
latent_patch = ["transformer.patch_size.1"]
latent_channels = ["vae.z_dim"]
spatial_scale = ["vae.scale_factor_spatial"]
temporal_scale = ["vae.scale_factor_temporal"]

[pipeline.defaults]
lower_order_final = 1
latent_patch = 2

[pipeline.vectors]
latents_mean = "vae.latents_mean"
latents_std = "vae.latents_std"

[pipeline.schedule]
request = []
step = [
  ["base", "1 + k * (1 / train_steps - 1) / steps"],
  ["shifted", "flow_shift * base / (1 + (flow_shift - 1) * base)"],
  ["sigma", "select(abs(shifted - 1) < 0.000001, shifted - 0.000001, shifted)"],
]
last = "0"
model_timestep = "floor(s0 * train_steps)"

[pipeline.step]
combine = "u + g * (c - u)"
latent_in = "x * latents_std + latents_mean"
output = "min(max(x / 2 + 0.5, 0), 1)"

[pipeline.multistep]
state = ["last", "m1", "m2"]
scalars = [
  ["p_order", "min(min(order, select(lower_order_final, steps - k, order)), k + 1)"],
  ["c_order", "min(min(order, select(lower_order_final, steps - k + 1, order)), k)"],
  ["lam0", "log(1 - s0) - log(s0)"],
  ["lam1", "select(s1 > 0, log(1 - s1) - log(s1), 1e30)"],
  ["lamp", "log(1 - sp) - log(sp)"],
  ["lampp", "log(1 - spp) - log(spp)"],
  ["ph", "lam1 - lam0"],
  ["pbh", "exp(-ph) - 1"],
  ["prk", "(lamp - lam0) / ph"],
  ["pa", "s1 / s0"],
  ["pm", "(1 - s1) * (-pbh) + select(p_order == 2, (1 - s1) * pbh * 0.5 / prk, 0)"],
  ["pp", "select(p_order == 2, -(1 - s1) * pbh * 0.5 / prk, 0)"],
  ["ch", "select(k > 0, lam0 - lamp, 1)"],
  ["chh", "-ch"],
  ["cbh", "exp(chh) - 1"],
  ["crk", "select(k > 1, (lampp - lamp) / ch, 1)"],
  ["b1", "((exp(chh) - 1) / chh - 1) / cbh"],
  ["b2", "(((exp(chh) - 1) / chh - 1) / chh - 0.5) * 2 / cbh"],
  ["rho0", "select(c_order == 2, (b1 - b2) / (1 - crk), 0)"],
  ["rho1", "select(c_order == 2, b1 - rho0, 0.5)"],
  ["cx", "select(k > 0, 0, 1)"],
  ["ca", "select(k > 0, s0 / sp, 0)"],
  ["cc", "select(k > 0, -(1 - s0) * cbh * rho0 / crk, 0)"],
  ["cd", "select(k > 0, -(1 - s0) * cbh * rho1, 0)"],
  ["cb", "select(k > 0, -(1 - s0) * cbh - cc - cd, 0)"],
]
assign = [
  ["m", "x - s0 * v"],
  ["y", "cx * x + ca * last + cb * m1 + cc * m2 + cd * m"],
  ["x", "pa * y + pm * m + pp * m1"],
  ["m2", "m1"],
  ["m1", "m"],
  ["last", "y"],
]

[pipeline.options]
offload_text_encoder = true
offload_vae = false
