name = "gemma3"
kind = "family"
extends = "base"

[match]
model_types = ["gemma3_text", "gemma3"]
architectures = ["Gemma3ForCausalLM", "Gemma3ForConditionalGeneration"]

[attention]
qk_norm = true

[blocks]
sliding_period_key = "sliding_window_pattern"

[rope]
local_theta_key = "rope_local_base_freq"

[norm]
unit_offset = true
sandwich = true

[embedding]
scale = "sqrt_hidden"
tie = true

[vision]
pooled = true
bidirectional = true
soft_tokens_key = "mm_tokens_per_image"
placeholder = "<start_of_image>"
wrap = "\n\n"

[vision.token_keys]
image = "image_token_index"
video = ""
start = "boi_token_index"
end = "eoi_token_index"
