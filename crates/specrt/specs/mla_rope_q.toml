kind = "kir-kernel"
family = "span_rope"
name = "mla_rope_q"
threads = 32

[args]
row = "heads * (qk_nope_head_dim + qk_rope_head_dim) + kv_lora_rank + qk_rope_head_dim"
head = "qk_nope_head_dim + qk_rope_head_dim"
offset = "qk_nope_head_dim"
rot = "qk_rope_head_dim"
style = "pairs"

[[param]]
name = "x"
type = "f32"
role = "activation"
access = "write"

[[param]]
name = "pos"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "layer"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "pos_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "row_step"
type = "i32"
role = "value"
access = "read"

