name = "qwen4_exp"
kind = "family"
min_engine = 18
extends = "qwen3_5"

[match]
model_types = ["qwen4_exp", "qwen4_exp_text"]
architectures = ["Qwen4ExpForConditionalGeneration", "Qwen4ExpForCausalLM"]
gguf = []

[mtp_layout]
layer = "mtp.layers.0"
fc = "mtp.fc_embedding.weight"
fc_hidden = "mtp.fc_hidden.weight"
norm_embed = "mtp.pre_fc_norm_embedding.weight"
norm_hidden = "mtp.pre_fc_norm_hidden.weight"
mixer = "mtp.hyper_connection_mixer"

[vision]
ignore = true

[moe]
fused_experts = true

[norm]
pre = false

[linear]
gate_key = "output_gate_type"

[gated_residual]
streams = "hc_count"
module = "hyper_connection_mixer"
sites = ["attn_hyper_connection", "mlp_hyper_connection"]

[gated_residual.params]
hc_lowrank = { config = "hc_lowrank" }
hc_blocks = { expr = "floor((hidden_size + 127) / 128)" }

[gated_residual.scratch]
hc_normed = "hc_width"
hc_low = "hc_lowrank"
hc_gate = "hc_width"
hc_inject = "hc_streams"

[[gated_residual.node]]
op = "expand"
kernel = "hc_expand"
grid = ["hc_blocks", "rows"]

[gated_residual.node.bind]
x = { buffer = "streams" }
a = { buffer = "x" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_norm"
grid = ["hc_streams", "rows"]

[gated_residual.node.bind]
x = { buffer = "streams" }
g = { buffer = "streams" }
w = { weight = "hc_norm.weight", len = "hc_width" }
y = { buffer = "hc_normed" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_down"
grid = ["1", "rows"]

[gated_residual.node.bind]
x = { buffer = "hc_normed" }
w = { weight = "input_mix_weight_down.weight", len = "hc_lowrank * hc_width" }
y = { buffer = "hc_low" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_act"
grid = ["1", "rows"]

[gated_residual.node.bind]
x = { buffer = "hc_low" }
out = { buffer = "hc_low" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_up"
grid = ["hc_streams", "rows"]

[gated_residual.node.bind]
x = { buffer = "hc_low" }
w = { weight = "input_mix_weight_up.weight", len = "hc_width * hc_lowrank" }
y = { buffer = "hc_gate" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_inject"
grid = ["1", "rows"]
when = "site"

[gated_residual.node.bind]
x = { buffer = "hc_normed" }
w = { weight = "block_inject_weight.weight", len = "hc_streams * hc_width" }
y = { buffer = "hc_inject" }

[[gated_residual.node]]
op = "pre"
kernel = "hc_mix"
grid = ["hc_blocks", "rows"]

[gated_residual.node.bind]
a = { buffer = "hc_gate" }
b = { buffer = "hc_normed" }
y = { buffer = "x" }

[[gated_residual.node]]
op = "post"
kernel = "hc_inject_add"
grid = ["hc_blocks", "rows"]

[gated_residual.node.bind]
x = { buffer = "streams" }
a = { buffer = "x" }
c = { buffer = "hc_inject" }

[prelude]
module = "ple"
layers_key = "ple_layer_ids"
layers_base = 1
index = "ple_index"
count = "ple_layers"

[prelude.params]
streams = { config = "hc_count" }
ngram_size = { config = "ngram_size", default = 3.0 }
heads_per_ngram = { config = "heads_per_ngram", default = 8.0 }
ngram_heads = { expr = "(ngram_size - 1) * heads_per_ngram" }
ngram_base = { config = "ngram_vocab_size_base", default = 20000000.0 }
ngram_seed = { config = "seed", default = 1234.0 }
ngram_eos = { config = "eos_token_id" }
ngram_rows = { int = "(prime_sum(ngram_base - 1, 1, ngram_heads) + make_ngram_vocab_size_divisible_by - 1) / make_ngram_vocab_size_divisible_by * make_ngram_vocab_size_divisible_by" }
ple_embed_dim = { config = "ple_embed_dim", alt = "hidden_size" }
ple_head_dim = { expr = "ple_embed_dim / ngram_heads" }
ple_conv_taps = { config = "ple_conv_kernel_size", default = 4.0 }
ple_conv_state = { expr = "(ple_conv_taps - 1) * ngram_size" }
ple_gate_scale = { expr = "1 / sqrt(hidden_size)" }
ple_width = { expr = "hc_count * hidden_size" }
ple_blocks = { expr = "floor((hc_count * hidden_size + 127) / 128)" }

[prelude.scratch]
ple_emb = "ple_embed_dim"
ple_key = "ple_width"
ple_value = "hidden"
ple_gated = "ple_width"
ple_normed = "ple_width"
ple_convolved = "ple_width"
ple_out = "ple_width"

[prelude.int_scratch]
ple_ids = "ngram_heads"

[prelude.stored]
ple_table = "ple_embedding.ngram_embedding.weight"

[[prelude.node]]
op = "kernel"
kernel = "ple_ngram_hash"
grid = ["seqs"]

[prelude.node.bind]
tokens = { buffer = "tokens" }
idx = { buffer = "ple_ids" }
state = { state = "ngram_history" }

[[prelude.node]]
op = "kernel"
kernel = "ple_embed_gather"
grid = ["ngram_heads", "rows"]

[prelude.node.bind]
idx = { buffer = "ple_ids" }
table = { weight = "ple_embedding.ngram_embedding.weight", len = "ngram_rows * ple_head_dim" }
emb = { buffer = "ple_emb" }

[[prelude.node]]
op = "kernel"
kernel = "ple_key_proj"
grid = ["1", "rows"]

[prelude.node.bind]
x = { buffer = "ple_emb" }
w = { weight = "key_proj.weight", len = "ple_width * ple_embed_dim" }
y = { buffer = "ple_key" }

[[prelude.node]]
op = "kernel"
kernel = "ple_value_proj"
grid = ["1", "rows"]

[prelude.node.bind]
x = { buffer = "ple_emb" }
w = { weight = "value_proj.weight", len = "hidden * ple_embed_dim" }
y = { buffer = "ple_value" }

[[prelude.node]]
op = "kernel"
kernel = "ple_gate"
grid = ["streams", "rows"]

[prelude.node.bind]
key = { buffer = "ple_key" }
value = { buffer = "ple_value" }
x = { buffer = "streams" }
norm_key = { weight = "norm_key.weight", len = "ple_width" }
norm_query = { weight = "norm_query.weight", len = "ple_width" }
norm_conv = { weight = "norm_conv.weight", len = "ple_width" }
gated = { buffer = "ple_gated" }
normed = { buffer = "ple_normed" }

[[prelude.node]]
op = "kernel"
kernel = "ple_conv"
grid = ["ple_blocks", "seqs"]

[prelude.node.bind]
x = { buffer = "ple_normed" }
w = { weight = "conv1d.weight", len = "ple_width * ple_conv_taps" }
y = { buffer = "ple_convolved" }
state = { state = "ple_conv" }

[[prelude.node]]
op = "kernel"
kernel = "ple_add"
grid = ["streams", "rows"]

[prelude.node.bind]
x = { buffer = "streams" }
gated = { buffer = "ple_gated" }
conv = { buffer = "ple_convolved" }
ple = { buffer = "ple_out" }
out = { buffer = "streams" }

[attention.params]
index_heads = { config = "indexer_n_heads" }
index_head_dim = { config = "indexer_head_dim" }
index_ratio = { config = "indexer_compress_ratio" }
index_groups = { expr = "indexer_budget / indexer_compress_ratio" }
index_out = { expr = "indexer_budget + indexer_compress_ratio - 1" }
index_scale = { expr = "rsqrt(indexer_head_dim)" }

[attention.int_scratch]
index_sel = "index_out"

[attention.scratch]
index_scores = "floor(max_context / index_ratio)"

[[attention.projection]]
tensor = "indexer.index_qk_proj"
rows = "(index_heads + 1) * index_head_dim"
append = true

[[state]]
name = "k"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "v"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "index_raw"
per = "token"
layers = "attention"
shape = ["1", "index_head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "index_pool"
per = "token"
layers = "attention"
shape = ["1", "index_head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "conv"
per = "sequence"
layers = "linear"
shape = ["conv_dim", "conv_taps"]
dtype = "f32"
rollback = "checkpoint"

[[state]]
name = "ssm"
per = "sequence"
layers = "linear"
shape = ["value_heads", "key_head_dim", "key_head_dim"]
dtype = "f32"
rollback = "checkpoint"

[[state]]
name = "ngram_history"
per = "sequence"
layers = "prelude"
shape = ["ngram_size - 1"]
dtype = "f32"
rollback = "checkpoint"

[[state]]
name = "ple_conv"
per = "sequence"
layers = "prelude"
shape = ["ple_width", "ple_conv_state"]
dtype = "f32"
rollback = "checkpoint"

[[attention.node]]
op = "qk_rope"
phase = "prefill"

[[attention.node]]
op = "decode_rope"
phase = "rows"

[[attention.node]]
op = "kernel"
kernel = "qsa_index_raw_write"
grid = ["1", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "index_raw" }

[[attention.node]]
op = "kernel"
kernel = "qsa_index_pool"
grid = ["1", "rows"]

[attention.node.bind]
raw = { state = "index_raw" }
norm = { weight = "indexer.k_layernorm.weight", len = "index_head_dim" }
dst = { state = "index_pool" }

[[attention.node]]
op = "kernel"
kernel = "qsa_index_select"
grid = ["1", "rows"]

[attention.node.bind]
q = { buffer = "qkv" }
norm = { weight = "indexer.q_layernorm.weight", len = "index_head_dim" }
keys = { state = "index_pool" }
idx = { buffer = "index_sel" }
scale = "index_scale"
scores = { buffer = "index_scores" }

[[attention.node]]
op = "kernel"
kernel = "qsa_attention"
grid = ["heads", "rows"]

[attention.node.bind]
idx = { buffer = "index_sel" }
