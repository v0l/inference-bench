kind = "kir-kernel"
family = "head_matvec"
name = "v4_o_group"
threads = 128

[args]
x_row = "heads * head_dim"
x_head = "heads * head_dim / o_groups"
x_offset = 0
inner = "heads * head_dim / o_groups"
w_head = "o_lora_rank * heads * head_dim / o_groups"
w_inner = 1
w_out = "heads * head_dim / o_groups"
w_offset = 0
out = "o_lora_rank"
y_row = "o_groups * o_lora_rank"
y_head = "o_lora_rank"
y_offset = 0

[[param]]
name = "x"
type = "f32"
role = "activation"
access = "read"

[[param]]
name = "w"
type = "f32"
role = "weight"
access = "read"

[[param]]
name = "out_hi"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "out_lo"
type = "bf16"
role = "activation"
access = "write"
