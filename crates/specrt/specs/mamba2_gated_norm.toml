kind = "kir-kernel"
family = "group_norm"
name = "mamba2_gated_norm"
threads = 128

[args]
x_row = "ssm_inner"
x_offset = 0
g_row = "ssm_in"
g_offset = 0
width = "ssm_inner / ssm_groups"
w_group = "ssm_inner / ssm_groups"
out_row = "ssm_inner"
eps = "norm_eps"
input = "x * silu(g)"
output = "w * n"

[[param]]
name = "x"
role = "activation"
access = "read"

[[param]]
name = "g"
role = "activation"
access = "read"

[[param]]
name = "w"
role = "weight"
access = "read"

[[param]]
name = "out_hi"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "out_lo"
type = "bf16"
role = "activation"
access = "write"
