kind = "kir-kernel"
family = "group_map"
name = "g3n_laurel_add"
threads = 256

[args]
width = "hidden"

[[const]]
name = "eps"
value = "norm_eps"

[[param]]
name = "xin"
role = "activation"
access = "read"

[[param]]
name = "pred"
role = "activation"
access = "read"

[[param]]
name = "n"
role = "weight"
access = "read"

[[param]]
name = "lr"
role = "activation"
access = "read"

[[param]]
name = "pn"
role = "weight"
access = "read"

[[param]]
name = "x"
role = "activation"
access = "write"

[[stage]]
op = "load"
name = "p0"
src = "pred"
row = "hc_width"

[[stage]]
op = "sum"
name = "sp"
expr = "p0 * p0"

[[stage]]
op = "scalar"
name = "ip"
expr = "rsqrt(sp / width + eps)"

[[stage]]
op = "load"
name = "r"
src = "lr"
row = "hidden"

[[stage]]
op = "sum"
name = "sr"
expr = "r * r"

[[stage]]
op = "scalar"
name = "ir"
expr = "rsqrt(sr / width + eps)"

[[stage]]
op = "load"
name = "nv"
src = "n"

[[stage]]
op = "load"
name = "pv"
src = "pn"

[[stage]]
op = "load"
name = "a"
src = "xin"
row = "hidden"

[[stage]]
op = "store"
dst = "x"
value = "(a + p0 * ip * nv + r * ir * pv) * 0.7071067811865476"
row = "hidden"
