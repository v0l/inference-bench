kind = "kir-kernel"
family = "compose"
name = "dit_glu"
threads = 256

[args]
width = "mlp"

[rows]
iter = "grid"
address = "advance"
per_row = ["out_hi", "out_lo"]

[rows.stride]
fused = "glu_stride"

[rows.offset]
fused = "glu_offset"

[[param]]
name = "fused"
role = "activation"
access = "read"

[[param]]
name = "out_hi"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "out_lo"
type = "bf16"
role = "activation"
access = "write"

[[stage]]
op = "tile_load"
name = "g"
src = "fused"
layout = "(width,2):(1,width)"
at = ["i", "0"]

[[stage]]
op = "tile_load"
name = "u"
src = "fused"
layout = "(width,2):(1,width)"
at = ["i", "1"]

[[stage]]
op = "epilogue"
name = "y"
expr = "silu(g) * u"

[[stage]]
op = "split_store"
dst = "out_hi"
lo = "out_lo"
value = "y"
