name = "base"
kind = "family"
min_engine = 8

[activation]
lenient_default = "swiglu"

[activation.map]
silu = "swiglu"
gelu_pytorch_tanh = "geglu"
gelu_new = "geglu"
gelu_fast = "geglu"

[dtypes]
keys = ["torch_dtype", "dtype"]
accepted = ["bfloat16", "float16", "float32"]

[fields]
hidden_act = ["hidden_activation"]

[rope]
type_keys = ["rope_type", "type"]
unscaled = ["default"]

[rope.types]
linear = "linear"
llama3 = "llama3"
yarn = "yarn"

[rope.keys]
original_max_positions = "original_max_position_embeddings"

[quantization]
method_key = "quant_method"
grouped_methods = ["compressed-tensors", "modelopt"]
layers_key = "quantized_layers"
layer_prefixes = ["model.language_model.layers.", "model.layers."]
projections = ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "linear_attn.in_proj_qkv", "linear_attn.in_proj_z", "linear_attn.out_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
skip_targets = ["lm_head"]
groups_key = "config_groups"
all_linear_target = "Linear"
layer_marker = "layers."
mlp_marker = "mlp."
group_error = "compressed-tensors group {name} is not supported (fp8 per-channel and nvfp4 group 16 are)"
flat_error = "quantization {q} is not supported (fp8 e4m3 with 128x128 blocks and compressed-tensors fp8/nvfp4 are)"

[[quantization.group_rules]]
quant = "fp8_channel"
when = { format = "float-quantized", "weights.type" = "float", "weights.num_bits" = 8, "weights.strategy" = "channel", "weights.symmetric" = true }

[[quantization.group_rules]]
quant = "nvfp4_g16"
when = { format = "nvfp4-pack-quantized", "weights.type" = "float", "weights.num_bits" = 4, "weights.strategy" = "tensor_group", "weights.symmetric" = true, "weights.group_size" = 16 }

[[quantization.group_rules]]
quant = "fp8_channel"
when = { quant_method = "modelopt", quant_algo = "FP8" }

[[quantization.group_rules]]
quant = "nvfp4_g16"
when = { quant_method = "modelopt", quant_algo = { any = ["NVFP4", "W4A16_NVFP4"] }, group_size = 16 }

[[quantization.flat_rules]]
quant = "fp8_channel"
when = { quant_method = "modelopt", quant_algo = "FP8" }

[[quantization.flat_rules]]
quant = "fp8_block128"
when = { quant_method = "fp8", fmt = "e4m3", weight_block_size = [128, 128] }
defaults = { fmt = "e4m3" }

[[quantization.act_rules]]
act = "fp8"
when = { "input_activations.type" = "float", "input_activations.dynamic" = { any = [true, "local"] }, "input_activations.num_bits" = 8, "input_activations.strategy" = "token" }

[[quantization.act_rules]]
act = "fp4"
when = { "input_activations.type" = "float", "input_activations.dynamic" = { any = [true, "local"] }, "input_activations.num_bits" = 4, "input_activations.strategy" = "tensor_group", "input_activations.group_size" = 16 }

[[quantization.act_rules]]
act = "fp4"
when = { quant_method = "modelopt", quant_algo = "NVFP4" }

[[state]]
name = "k"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "v"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "conv"
per = "sequence"
layers = "linear"
shape = ["conv_dim", "conv_taps"]
dtype = "f32"
rollback = "checkpoint"

[[state]]
name = "ssm"
per = "sequence"
layers = "linear"
shape = ["value_heads", "key_head_dim", "key_head_dim"]
dtype = "f32"
rollback = "checkpoint"

[blocks]
other_layer_type = "full"

[blocks.layer_types]
linear_attention = "linear"
full_attention = "full"
sliding_attention = "sliding"

[gguf]
unscaled = ["none"]

[gguf.rope_scaling]
linear = "linear"

[gguf.keys]
embedding_length = "{arch}.embedding_length"
block_count = "{arch}.block_count"
head_count = "{arch}.attention.head_count"
head_count_kv = "{arch}.attention.head_count_kv"
feed_forward_length = "{arch}.feed_forward_length"
expert_count = "{arch}.expert_count"
expert_used_count = "{arch}.expert_used_count"
expert_feed_forward_length = "{arch}.expert_feed_forward_length"
expert_shared_feed_forward_length = "{arch}.expert_shared_feed_forward_length"
key_length = "{arch}.attention.key_length"
value_length = "{arch}.attention.value_length"
rope_dimension_count = "{arch}.rope.dimension_count"
norm_epsilon = "{arch}.attention.layer_norm_rms_epsilon"
rope_freq_base = "{arch}.rope.freq_base"
rope_sections = "{arch}.rope.dimension_sections"
nextn_predict_layers = "{arch}.nextn_predict_layers"
ssm_conv_kernel = "{arch}.ssm.conv_kernel"
ssm_state_size = "{arch}.ssm.state_size"
ssm_group_count = "{arch}.ssm.group_count"
ssm_time_step_rank = "{arch}.ssm.time_step_rank"
ssm_inner_size = "{arch}.ssm.inner_size"
recurrent_layers = "{arch}.attention.recurrent_layers"
full_attention_interval = "{arch}.full_attention_interval"
rope_scaling_type = "{arch}.rope.scaling.type"
rope_scaling_factor = "{arch}.rope.scaling.factor"
rope_original_context = "{arch}.rope.scaling.original_context_length"

[gguf.tensors]
embedding = "token_embd.weight"
output = "output.weight"
q_bias = "attn_q.bias"
q_norm = "attn_q_norm.weight"
rope_freqs = "rope_freqs.weight"

[gguf.names]
"model.embed_tokens.weight" = "token_embd.weight"
"model.norm.weight" = "output_norm.weight"
"lm_head.weight" = "output.weight"

[gguf.layer]
"self_attn.q_proj.weight" = "attn_q.weight"
"self_attn.k_proj.weight" = "attn_k.weight"
"self_attn.v_proj.weight" = "attn_v.weight"
"self_attn.q_proj.bias" = "attn_q.bias"
"self_attn.k_proj.bias" = "attn_k.bias"
"self_attn.v_proj.bias" = "attn_v.bias"
"self_attn.o_proj.weight" = "attn_output.weight"
"self_attn.q_norm.weight" = "attn_q_norm.weight"
"self_attn.k_norm.weight" = "attn_k_norm.weight"
"input_layernorm.weight" = "attn_norm.weight"
"post_attention_layernorm.weight" = "ffn_norm.weight"
"mlp.gate_proj.weight" = "ffn_gate.weight"
"mlp.up_proj.weight" = "ffn_up.weight"
"mlp.down_proj.weight" = "ffn_down.weight"

[gguf.pretokenizers]
qwen35 = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?[\p{L}\p{M}]+|\p{N}| ?[^\s\p{L}\p{M}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
qwen2 = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
deepseek-r1-qwen = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
llama-bpe = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}{1,3}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
llama3 = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}{1,3}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
smaug-bpe = '''(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}{1,3}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+'''
