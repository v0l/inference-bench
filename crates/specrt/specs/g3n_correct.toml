kind = "kir-kernel"
family = "group_map"
name = "g3n_correct"
threads = 256

[args]
width = "hidden"

[[param]]
name = "pred"
role = "activation"
access = "read"

[[param]]
name = "m"
role = "activation"
access = "read"

[[param]]
name = "c"
role = "weight"
access = "read"

[[param]]
name = "x"
role = "activation"
access = "read"

[[param]]
name = "streams"
role = "activation"
access = "write"

[[stage]]
op = "pick"
name = "m0"
src = "m"
row = "hc_streams"
offset = 0

[[stage]]
op = "pick"
name = "m1"
src = "m"
row = "hc_streams"
offset = 1

[[stage]]
op = "pick"
name = "m2"
src = "m"
row = "hc_streams"
offset = 2

[[stage]]
op = "pick"
name = "m3"
src = "m"
row = "hc_streams"
offset = 3

[[stage]]
op = "pick"
name = "c0"
src = "c"
head = 4
offset = 0

[[stage]]
op = "pick"
name = "c1"
src = "c"
head = 4
offset = 1

[[stage]]
op = "pick"
name = "c2"
src = "c"
head = 4
offset = 2

[[stage]]
op = "pick"
name = "c3"
src = "c"
head = 4
offset = 3

[[stage]]
op = "scalar"
name = "k"
expr = "1.0 + c0 * m0 + c1 * m1 + c2 * m2 + c3 * m3"

[[stage]]
op = "load"
name = "own"
src = "pred"
row = "hc_width"
head = "hidden"

[[stage]]
op = "load"
name = "p0"
src = "pred"
row = "hc_width"

[[stage]]
op = "load"
name = "a"
src = "x"
row = "hidden"

[[stage]]
op = "store"
dst = "streams"
value = "own + k * (a - p0)"
row = "hc_width"
head = "hidden"
