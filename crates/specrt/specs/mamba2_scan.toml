kind = "kir-kernel"
family = "recurrence"
name = "mamba2_scan"

[recurrence]
state = "ssm"
keys = "ssm_state"
values = "ssm_head_dim"
ksplit = 4
layers = "linear_layers"

[[input]]
name = "b"
src = "xbc"
space = "key"
row = "ssm_conv"
head = "ssm_state"
per = "ssm_heads / ssm_groups"
offset = "ssm_inner"

[[input]]
name = "c"
src = "xbc"
space = "key"
row = "ssm_conv"
head = "ssm_state"
per = "ssm_heads / ssm_groups"
offset = "ssm_inner + ssm_groups * ssm_state"

[[input]]
name = "x"
src = "xbc"
space = "value"
row = "ssm_conv"
head = "ssm_head_dim"
offset = 0

[[input]]
name = "dt_raw"
src = "mix"
space = "scalar"
row = "ssm_in"
head = 1
offset = "ssm_inner + ssm_conv"

[[input]]
name = "a"
src = "a_log"
space = "scalar"
row = 0
head = 1
offset = 0

[[input]]
name = "dtb"
src = "dt_bias"
space = "scalar"
row = 0
head = 1
offset = 0

[[input]]
name = "d"
src = "skip"
space = "scalar"
row = 0
head = 1
offset = 0

[[stage]]
op = "scalar"
name = "dt"
expr = "softplus(dt_raw + dtb)"

[[stage]]
op = "scalar"
name = "keep"
expr = "exp(-exp(a) * dt)"

[[stage]]
op = "value"
name = "u"
expr = "dt * x"

[[stage]]
op = "decay"
expr = "keep"

[[stage]]
op = "update"
key = "b"
value = "u"

[[stage]]
op = "read"
name = "o"
key = "c"

[[stage]]
op = "store"
dst = "y"
value = "o + d * x"
row = "ssm_inner"
head = "ssm_head_dim"
offset = 0

[[param]]
name = "mix"
role = "activation"
access = "read"

[[param]]
name = "xbc"
role = "activation"
access = "read"

[[param]]
name = "a_log"
role = "weight"
access = "read"

[[param]]
name = "dt_bias"
role = "weight"
access = "read"

[[param]]
name = "skip"
role = "weight"
access = "read"

[[param]]
name = "y"
role = "activation"
access = "write"

[[param]]
name = "ssm"
role = "activation"
access = "write"

[[param]]
name = "slots"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "layer"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "slot_base"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "slot_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "rows_per_seq"
type = "i32"
role = "value"
access = "read"
