kind = "kir-kernel"
family = "scan_attention"
name = "attn_sinks"
threads = 128

[[param]]
name = "qkv"
type = "f32"
role = "activation"
access = "read"

[[param]]
name = "k_cache"
type = "bf16"
role = "activation"
access = "read"

[[param]]
name = "v_cache"
type = "bf16"
role = "activation"
access = "read"

[[param]]
name = "block_table"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "pos"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "slots"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "out_hi"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "out_lo"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "layer"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "pages"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "pos_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "row_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "sinks"
type = "f32"
role = "weight"
access = "read"

[[param]]
name = "window"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "softcap"
type = "f32"
role = "value"
access = "read"

[[stage]]
op = "epilogue"
name = "score"
expr = "select(softcap > 0.0, softcap * tanh(s * scale / softcap), s * scale)"

[[stage]]
op = "mask"
expr = "window <= 0 || k_pos > q_pos - window"

[[stage]]
op = "online_softmax"
value = "score"
sink = "sinks"
