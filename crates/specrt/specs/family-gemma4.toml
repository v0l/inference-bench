name = "gemma4"
kind = "family"
extends = "gemma3"

[match]
model_types = ["gemma4", "gemma4_text", "gemma4_unified", "gemma4_unified_text"]
architectures = ["Gemma4ForConditionalGeneration", "Gemma4ForCausalLM", "Gemma4UnifiedForConditionalGeneration"]

[[refuse]]
when = "hidden_size_per_layer_input > 0"
message = "Gemma 4 per-layer input embeddings (hidden_size_per_layer_input) are not supported yet"

[[refuse]]
when = "num_kv_shared_layers > 0"
message = "Gemma 4 KV sharing across layers (num_kv_shared_layers) is not supported yet"

[[refuse]]
when = "use_double_wide_mlp"
message = "Gemma 4 double wide MLP layers (use_double_wide_mlp) are not supported yet"

[norm]
unit_offset = false
layer_scale = "layer_scalar"

[fields]
num_experts_per_tok = ["top_k_experts"]

[moe]
router_module = "router.proj"
norm_topk = true
shared_gate = false
fused_experts = true
parallel_dense = true
router_norm = "mlp.router.scale"
router_norm_scale = "1 / sqrt(hidden_size)"
input_norm = "pre_feedforward_layernorm_2.weight"
expert_scale = "mlp.router.per_expert_scale"

[tensors]
".experts." = ".mlp.experts."
".router." = ".mlp.router."
"mlp.experts.down_proj" = "mlp.experts.down_proj.weight"
"mlp.experts.gate_up_proj" = "mlp.experts.gate_up_proj.weight"

[rope]
unscaled = ["default", "proportional"]

[vision]
ignore = true

[attention]
qk_norm = false
o_cols = "q_w"

[attention.params]
hd_s = { config = "head_dim" }
hd_g = { config = "global_head_dim", alt = "head_dim" }
heads_n = { config = "num_attention_heads" }
kvh_s = { config = "num_key_value_heads" }
k_eq_v = { config = "attention_k_eq_v", default = 0.0 }
kvh_global = { config = "num_global_key_value_heads", alt = "num_key_value_heads" }
kvh_g = { expr = "select(k_eq_v, kvh_global, kvh_s)" }
q_w = { expr = "heads_n * max(hd_s, hd_g)" }
kv_w = { expr = "max(kvh_s * hd_s, kvh_g * hd_g)" }
k_w = { expr = "kv_w" }
v_w = { expr = "kv_w" }
theta_s = { config = "rope_parameters.sliding_attention.rope_theta", default = 10000.0 }
theta_g = { config = "rope_parameters.full_attention.rope_theta", default = 1000000.0 }
rotary_g = { config = "rope_parameters.full_attention.partial_rotary_factor", default = 1.0 }
angles_s = { expr = "hd_s / 2" }
angles_g = { expr = "floor(rotary_g * hd_g / 2)" }

[[attention.o_cols_by]]
layers = ["sliding"]
cols = "heads * hd_s"

[[attention.o_cols_by]]
layers = ["full"]
cols = "heads * hd_g"

[[attention.projection]]
tensor = "q_proj"
rows = "heads * hd_s"
layers = ["sliding"]
slot = "q_w"

[[attention.projection]]
tensor = "q_proj"
rows = "heads * hd_g"
layers = ["full"]
slot = "q_w"

[[attention.projection]]
tensor = "k_proj"
rows = "kvh_s * hd_s"
layers = ["sliding"]
slot = "k_w"

[[attention.projection]]
tensor = "k_proj"
rows = "kvh_g * hd_g"
layers = ["full"]
slot = "k_w"

[[attention.projection]]
tensor = "v_proj"
rows = "kvh_s * hd_s"
layers = ["sliding"]
slot = "v_w"

[[attention.projection]]
tensor = "v_proj"
rows = "kvh_g * hd_g"
layers = ["full"]
slot = "v_w"
when = "!k_eq_v"

[[attention.projection]]
tensor = "k_proj"
rows = "kvh_g * hd_g"
layers = ["full"]
slot = "v_w"
when = "k_eq_v"

[[state]]
name = "k_s"
per = "token"
layers = "attention"
blocks = ["sliding"]
shape = ["kvh_s", "hd_s"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "v_s"
per = "token"
layers = "attention"
blocks = ["sliding"]
shape = ["kvh_s", "hd_s"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "k_g"
per = "token"
layers = "attention"
blocks = ["full"]
shape = ["kvh_g", "hd_g"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "v_g"
per = "token"
layers = "attention"
blocks = ["full"]
shape = ["kvh_g", "hd_g"]
dtype = "bf16"
rollback = "positional"

[[attention.node]]
op = "kernel"
kernel = "g4_q_norm_s"
layers = ["sliding"]
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }
w = { weight = "q_norm.weight", len = "hd_s" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_norm_s"
layers = ["sliding"]
grid = ["kvh_s", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }
w = { weight = "k_norm.weight", len = "hd_s" }

[[attention.node]]
op = "kernel"
kernel = "g4_v_norm_s"
layers = ["sliding"]
grid = ["kvh_s", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_q_rope_s"
layers = ["sliding"]
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_rope_s"
layers = ["sliding"]
grid = ["kvh_s", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_write_s"
layers = ["sliding"]
grid = ["kvh_s", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "k_s" }
layer = "kind_layer"

[[attention.node]]
op = "kernel"
kernel = "g4_v_write_s"
layers = ["sliding"]
grid = ["kvh_s", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "v_s" }
layer = "kind_layer"

[[attention.node]]
op = "kernel"
kernel = "g4_attn_s"
layers = ["sliding"]
grid = ["heads", "rows"]

[attention.node.bind]
k_cache = { state = "k_s" }
v_cache = { state = "v_s" }
layer = "kind_layer"
window = "window"

[[attention.node]]
op = "kernel"
kernel = "g4_q_norm_g"
layers = ["full"]
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }
w = { weight = "q_norm.weight", len = "hd_g" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_norm_g"
layers = ["full"]
grid = ["kvh_g", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }
w = { weight = "k_norm.weight", len = "hd_g" }

[[attention.node]]
op = "kernel"
kernel = "g4_v_norm_g"
layers = ["full"]
grid = ["kvh_g", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_q_rope_g"
layers = ["full"]
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_rope_g"
layers = ["full"]
grid = ["kvh_g", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }

[[attention.node]]
op = "kernel"
kernel = "g4_k_write_g"
layers = ["full"]
grid = ["kvh_g", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "k_g" }
layer = "kind_layer"

[[attention.node]]
op = "kernel"
kernel = "g4_v_write_g"
layers = ["full"]
grid = ["kvh_g", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "v_g" }
layer = "kind_layer"

[[attention.node]]
op = "kernel"
kernel = "g4_attn_g"
layers = ["full"]
grid = ["heads", "rows"]

[attention.node.bind]
k_cache = { state = "k_g" }
v_cache = { state = "v_g" }
layer = "kind_layer"
