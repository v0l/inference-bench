kind = "kir-kernel"
family = "state_write"
name = "v4_csa_raw_write"
threads = 128

[args]
src_row = "qkv_row"
src_offset = "q_lora_rank + 3 * head_dim"
layers = "raw_layers"
rows = 1
width = "4 * head_dim"
stride = "4 * head_dim"

[[param]]
name = "src"
type = "f32"
role = "activation"
access = "read"

[[param]]
name = "dst"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "pos"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "layer"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "pos_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "row_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "block_table"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "slots"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "pages"
type = "i32"
role = "value"
access = "read"
