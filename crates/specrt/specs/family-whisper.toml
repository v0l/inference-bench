name = "whisper"
kind = "family"
extends = "base"

[match]
model_types = ["whisper"]
architectures = ["WhisperForConditionalGeneration"]

[[refuse]]
when = "d_model > 0"
part = "text"
message = "Whisper is a speech to text model: its decoder reads encoder states of audio through cross attention, so it transcribes audio and does not serve text chat"

[remap]
hidden_size = "d_model"
intermediate_size = "decoder_ffn_dim"
num_hidden_layers = "decoder_layers"
num_attention_heads = "decoder_attention_heads"
num_key_value_heads = "decoder_attention_heads"
hidden_act = "activation_function"
max_position_embeddings = "max_target_positions"

[activation.map]
gelu = "mapped"

[mlp]
bias = true

[mlp.mapped]
expr = "gelu(x)"

[norm]
kind = "layer_norm"
eps = 0.00001

[attention]
qkv_bias = true
k_bias = false
o_bias = true

[rope]
nope_all = true

[embedding]
tie = true
positions = "embed_positions.weight"

[tensors]
"model.decoder." = "model."
"self_attn_layer_norm." = "input_layernorm."
"encoder_attn_layer_norm." = "cross_attn_layernorm."
"final_layer_norm." = "post_attention_layernorm."
"encoder_attn." = "cross_attn."
"out_proj." = "o_proj."
"fc1." = "mlp.up_proj."
"fc2." = "mlp.down_proj."
"model.layer_norm." = "model.norm."

[cross]
source = "model.encoder"
rows = "max_source_positions"
state = "cross_kv"

[[state]]
name = "k"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "v"
per = "token"
layers = "attention"
shape = ["kv_heads", "head_dim"]
dtype = "bf16"
rollback = "positional"

[[state]]
name = "cross_kv"
per = "sequence"
layers = "attention"
shape = ["2", "cross_rows", "hidden"]
dtype = "f32"
prefix_share = false
rollback = "checkpoint"
