kind = "kir-kernel"
family = "compose"
name = "dit_rms_modulate"
threads = 256

[args]
width = "hidden"

[rows]
iter = "block"
address = "advance"
per_row = ["x"]

[rows.stride]
out_hi = "hidden"
out_lo = "hidden"
shift = "mod_stride"
scale = "mod_stride"

[[param]]
name = "x"
role = "activation"
access = "read"

[[param]]
name = "shift"
role = "activation"
access = "read"

[[param]]
name = "scale"
role = "activation"
access = "read"

[[param]]
name = "out_hi"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "out_lo"
type = "bf16"
role = "activation"
access = "write"

[[const]]
name = "eps"
value = "norm_eps"

[[stage]]
op = "tile_load"
name = "v"
src = "x"

[[stage]]
op = "block_sum"
name = "total"
expr = "v * v"

[[stage]]
op = "epilogue"
name = "inv"
expr = "rsqrt(total / width + eps)"

[[stage]]
op = "tile_load"
name = "u"
src = "x"

[[stage]]
op = "tile_load"
name = "b"
src = "shift"

[[stage]]
op = "tile_load"
name = "s"
src = "scale"

[[stage]]
op = "epilogue"
name = "y"
expr = "u * inv * (1.0 + s) + b"

[[stage]]
op = "split_store"
dst = "out_hi"
lo = "out_lo"
value = "y"
