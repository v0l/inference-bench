name = "kimi_k3"
kind = "family"
min_engine = 17
extends = "kimi_linear"

[match]
model_types = ["kimi_k3", "kimi_k31"]
architectures = ["KimiK3ForConditionalGeneration"]

[vision]
ignore = true

[fields]
kda_full_rank_gate = ["linear_attn_config.use_full_rank_gate"]
dsa_index_topk = ["dsa_config.index_topk"]

[activation.map]
situ = "swiglu"

[mlp.gated]
act = "situ"
expr = "beta * tanh(g / beta) * sigmoid(g) * linear_beta * tanh(u / linear_beta)"

[mlp.gated.params]
beta = { config = "activation_situ_beta", default = 1.0 }
linear_beta = { config = "activation_situ_linear_beta" }

[attention]
o_cols = "heads * v_head_dim"
head_dim = "qk_nope_head_dim + qk_rope_head_dim"

[[attention.projection]]
tensor = "q_a_proj"
rows = "q_lora_rank"

[[attention.projection]]
tensor = "kv_a_proj_with_mqa"
rows = "kv_lora_rank + qk_rope_head_dim"

[[attention.projection]]
tensor = "g_proj"
rows = "heads * v_head_dim"

[attention.scratch]
qr = "heads * (qk_nope_head_dim + qk_rope_head_dim)"
v_out = "heads * v_head_dim"

[attention.params]
q_lora_rank = { config = "q_lora_rank" }
mla_output_gate = { config = "mla_use_output_gate" }
mla_gate_offset = { expr = "q_lora_rank + kv_lora_rank + qk_rope_head_dim" }
mla_lora_eps = 0.000001

[[attention.node]]
op = "kernel"
kernel = "mla_q_lora_norm_e6"
grid = ["rows"]

[attention.node.bind]
x = { buffer = "qkv" }
out = { buffer = "qkv" }
weight = { weight = "q_a_layernorm.weight", len = "q_lora_rank" }

[[attention.node]]
op = "kernel"
kernel = "mla_kv_lora_norm_e6"
grid = ["rows"]

[attention.node.bind]
x = { buffer = "qkv" }
out = { buffer = "qkv" }
weight = { weight = "kv_a_layernorm.weight", len = "kv_lora_rank" }

[[attention.node]]
op = "kernel"
kernel = "dsa_q_b"
grid = ["1", "rows"]

[attention.node.bind]
x = { buffer = "qkv" }
w = { weight = "q_b_proj.weight", len = "q_lora_rank * heads * (qk_nope_head_dim + qk_rope_head_dim)" }
y = { buffer = "qr" }

[[attention.node]]
op = "kernel"
kernel = "dsa_latent_write"
grid = ["1", "rows"]

[attention.node.bind]
src = { buffer = "qkv" }
dst = { state = "latent" }

[[attention.node]]
op = "kernel"
kernel = "dsa_absorb_q"
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "qr" }
w = { weight = "kv_b_proj.weight", len = "heads * (qk_nope_head_dim + v_head_dim) * kv_lora_rank" }
y = { buffer = "q_latent" }

[[attention.node]]
op = "kernel"
kernel = "mla_lora_attention"
grid = ["heads", "rows"]

[attention.node.bind]
qr = { buffer = "qr" }
k_cache = { state = "latent" }
v_cache = { state = "latent" }
q_latent = { buffer = "q_latent" }
out = { buffer = "o_latent" }
softmax_scale = "softmax_scale"

[[attention.node]]
op = "kernel"
kernel = "mla_expand_v_rows"
grid = ["heads", "rows"]

[attention.node.bind]
x = { buffer = "o_latent" }
w = { weight = "kv_b_proj.weight", len = "heads * (qk_nope_head_dim + v_head_dim) * kv_lora_rank" }
y = { buffer = "v_out" }

[[attention.node]]
op = "kernel"
kernel = "mla_out_gate"
grid = ["1", "rows"]

[attention.node.bind]
attn = { buffer = "v_out" }
gate = { buffer = "qkv" }

[[mixer.projection]]
tensor = "q_proj"
rows = "kda_qkv"

[[mixer.projection]]
tensor = "k_proj"
rows = "kda_qkv"

[[mixer.projection]]
tensor = "v_proj"
rows = "kda_qkv"

[[mixer.projection]]
tensor = "f_a_proj"
rows = "kda_head_dim"

[[mixer.projection]]
tensor = "g_proj"
rows = "kda_qkv"

[[mixer.projection]]
tensor = "b_proj"
rows = "kda_heads"

[mixer.params]
kda_full_rank = { config = "linear_attn_config.use_full_rank_gate" }
kda_lower_bound = { config = "linear_attn_config.gate_lower_bound" }
kda_g_offset = { expr = "3 * kda_qkv + kda_head_dim" }
kda_beta_offset = { expr = "4 * kda_qkv + kda_head_dim" }
kda_beta_row = { expr = "4 * kda_qkv + kda_head_dim + kda_heads" }

[mixer.scratch]
ogate = "1"

[[mixer.node]]
op = "kernel"
kernel = "kda_conv_q"
grid = ["kda_conv_blocks", "seqs"]

[mixer.node.bind]
x = { buffer = "mix" }
w = { weight = "q_conv1d.weight", len = "kda_qkv * kda_taps" }
y = { buffer = "conv" }
state = { state = "conv_q" }

[[mixer.node]]
op = "kernel"
kernel = "kda_conv_k"
grid = ["kda_conv_blocks", "seqs"]

[mixer.node.bind]
x = { buffer = "mix" }
w = { weight = "k_conv1d.weight", len = "kda_qkv * kda_taps" }
y = { buffer = "conv" }
state = { state = "conv_k" }

[[mixer.node]]
op = "kernel"
kernel = "kda_conv_v"
grid = ["kda_conv_blocks", "seqs"]

[mixer.node.bind]
x = { buffer = "mix" }
w = { weight = "v_conv1d.weight", len = "kda_qkv * kda_taps" }
y = { buffer = "conv" }
state = { state = "conv_v" }

[[mixer.node]]
op = "kernel"
kernel = "kda_forget_up"
grid = ["1", "rows"]

[mixer.node.bind]
x = { buffer = "mix" }
w = { weight = "f_b_proj.weight", len = "kda_qkv * kda_head_dim" }
y = { buffer = "gate" }

[[mixer.node]]
op = "kernel"
kernel = "kda_recurrence"
grid = ["kda_heads", "seqs"]

[mixer.node.bind]
mix = { buffer = "conv" }
betas = { buffer = "mix" }
gates = { buffer = "gate" }
dt_bias = { weight = "dt_bias", len = "kda_qkv" }
a_log = { weight = "A_log", len = "kda_heads" }
y = { buffer = "core" }
kda = { state = "kda" }

[[mixer.node]]
op = "kernel"
kernel = "kda_gated_norm_mix"
grid = ["kda_heads", "rows"]

[mixer.node.bind]
x = { buffer = "core" }
g = { buffer = "mix" }
w = { weight = "o_norm.weight", len = "kda_head_dim" }

[moe.latent]
width = "routed_expert_hidden_size"
down = "routed_expert_down_proj"
up = "routed_expert_up_proj"
norm = "routed_expert_norm"
norm_key = "latent_moe_use_norm"

[block_residual]
size = "attn_res_block_size"
sites = ["self_attention_res", "mlp_res"]
output = "output_attn_res"

[[refuse]]
when = "mla_use_output_gate == 0"
message = "the kimi_k3 family describes MLA with the output gate; this config turns mla_use_output_gate off"

[[refuse]]
when = "kda_full_rank_gate == 0"
message = "the kimi_k3 family describes the full rank KDA output gate; this config turns use_full_rank_gate off"

[[refuse]]
when = "dsa_index_topk > 0"
message = "Kimi K3.1 sparse attention (dsa_config) on the MLA layers is not supported yet (#1361)"
