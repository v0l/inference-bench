kind = "kir-kernel"
family = "head_matvec"
name = "dsa_absorb_q"
threads = 128

[args]
x_row = "heads * (qk_nope_head_dim + qk_rope_head_dim)"
x_head = "qk_nope_head_dim + qk_rope_head_dim"
x_offset = 0
inner = "qk_nope_head_dim"
w_head = "(qk_nope_head_dim + v_head_dim) * kv_lora_rank"
w_inner = "kv_lora_rank"
w_out = 1
w_offset = 0
out = "kv_lora_rank"
y_row = "heads * kv_lora_rank"
y_head = "kv_lora_rank"
y_offset = 0

[[param]]
name = "x"
type = "f32"
role = "activation"
access = "read"

[[param]]
name = "w"
type = "f32"
role = "weight"
access = "read"

[[param]]
name = "y"
type = "f32"
role = "activation"
access = "write"
