kind = "kir-kernel"
family = "group_map"
name = "g3n_ple_add"
threads = 256

[args]
width = "hidden"

[[const]]
name = "eps"
value = "norm_eps"

[[param]]
name = "pout"
role = "activation"
access = "read"

[[param]]
name = "w"
role = "weight"
access = "read"

[[param]]
name = "sin"
role = "activation"
access = "read"

[[param]]
name = "streams"
role = "activation"
access = "write"

[[stage]]
op = "load"
name = "p"
src = "pout"
row = "hidden"

[[stage]]
op = "sum"
name = "ss"
expr = "p * p"

[[stage]]
op = "scalar"
name = "inv"
expr = "rsqrt(ss / width + eps)"

[[stage]]
op = "load"
name = "wv"
src = "w"

[[stage]]
op = "load"
name = "s"
src = "sin"
row = "hc_width"
head = "hidden"
offset = "hidden"

[[stage]]
op = "store"
dst = "streams"
value = "s + p * inv * wv"
row = "hc_width"
head = "hidden"
offset = "hidden"
