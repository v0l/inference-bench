kind = "kir-kernel"
family = "compose"
name = "dit_unpatchify"
threads = 256

[args]
width = "grid_elems"

[rows]
iter = "grid"
address = "advance"
per_row = ["velocity"]

[[param]]
name = "tokens"
role = "activation"
access = "read"

[[param]]
name = "velocity"
role = "activation"
access = "write"

[[stage]]
op = "tile_load"
name = "v"
src = "tokens"
layout = "((latent_patch,patch_w,latent_patch,patch_h,grid_channels)):((1,in_channels,latent_patch,patch_w * in_channels,latent_patch * latent_patch))"
at = ["i"]

[[stage]]
op = "tile_store"
dst = "velocity"
value = "v"
