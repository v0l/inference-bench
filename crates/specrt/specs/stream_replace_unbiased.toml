kind = "kir-kernel"
family = "group_map"
name = "stream_replace_unbiased"
threads = 256

[args]
width = "prompt_dim"

[[param]]
name = "raw"
role = "activation"
access = "read"

[[param]]
name = "w"
role = "weight"
access = "read"

[[param]]
name = "m"
role = "activation"
access = "read"

[[param]]
name = "xin"
role = "activation"
access = "read"

[[param]]
name = "x"
role = "activation"
access = "write"

[[stage]]
op = "load"
name = "r"
src = "raw"
row = "prompt_dim"

[[stage]]
op = "load"
name = "wv"
src = "w"
head = "prompt_dim"

[[stage]]
op = "sum"
name = "d"
expr = "r * wv"

[[stage]]
op = "pick"
name = "mv"
src = "m"
row = 1
head = 0

[[stage]]
op = "pick"
name = "xv"
src = "xin"
row = "hidden"
head = 1

[[stage]]
op = "put"
dst = "x"
value = "xv + mv * (d - xv)"
row = "hidden"
head = 1
