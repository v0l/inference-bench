kind = "kir-kernel"
family = "state_write"
name = "mla_latent_write"
threads = 128

[args]
src_row = "heads * (qk_nope_head_dim + qk_rope_head_dim) + kv_lora_rank + qk_rope_head_dim"
src_offset = "heads * (qk_nope_head_dim + qk_rope_head_dim)"
layers = "latent_layers"
rows = 1
width = "kv_lora_rank + qk_rope_head_dim"

[[param]]
name = "src"
type = "f32"
role = "activation"
access = "read"

[[param]]
name = "dst"
type = "bf16"
role = "activation"
access = "write"

[[param]]
name = "pos"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "layer"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "pos_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "row_step"
type = "i32"
role = "value"
access = "read"

[[param]]
name = "block_table"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "slots"
type = "i32"
role = "activation"
access = "read"

[[param]]
name = "pages"
type = "i32"
role = "value"
access = "read"

