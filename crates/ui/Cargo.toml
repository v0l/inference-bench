[package]
name = "inference-bench-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "inference-bench-ui"
path = "src/main.rs"

[dependencies]
inference-bench-core.workspace = true
inference-bench-server = { workspace = true, default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing.workspace = true
anyhow.workspace = true
eframe = "0.37"
egui = "0.37"
egui_bench = { git = "https://github.com/v0l/egui_bench", rev = "21292b6cd92269898e017416db5644963bb90993", features = ["markdown", "chat"] }
serde_json.workspace = true
chrono.workspace = true

serde.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq.workspace = true
