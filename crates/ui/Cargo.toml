[package]
name = "inference-bench-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "inference-bench-ui"
path = "src/main.rs"

[dependencies]
inference-bench-core.workspace = true
specrt = { package = "inference-bench-specrt", path = "../specrt" }
inference-bench-server = { workspace = true, default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing.workspace = true
anyhow.workspace = true
eframe = "0.37"
egui = "0.37"
egui_bench = { version = "0.10.0", features = ["markdown"] }
agent-core = { git = "https://github.com/v0l/agentbench", rev = "8865c7f", features = ["sandbox"] }
agent-ui = { git = "https://github.com/v0l/agentbench", rev = "8865c7f", features = ["sandbox"] }
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true

serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
specrt = { package = "inference-bench-specrt", path = "../specrt", features = ["wgpu"] }

[dev-dependencies]
toml.workspace = true
tracing-subscriber.workspace = true
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
