bind = "127.0.0.1:8080"
api_keys_env = "INFERENCE_BENCH_API_KEYS"
max_concurrent = 1
queue_depth = 16
retry_after_secs = 1
idle_unload_secs = 900
max_loaded_models = 1
default_model = "qwen3-0.6b"
access_log = "/var/log/inference-bench/access.log"

max_ctx = 4096

[[models]]
id = "qwen3-0.6b"
model = "/etc/inference-bench/specs/qwen3-0.6b.toml"
preload = true
