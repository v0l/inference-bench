bind = "127.0.0.1:8080"
api_keys_env = "INFERENCE_BENCH_API_KEYS"
max_concurrent = 1
queue_depth = 16
retry_after_secs = 1
idle_unload_secs = 900
max_loaded_models = 1
default_model = "qwen3-0.6b"
access_log = "/var/log/inference-bench/access.log"

max_ctx = 4096
tool_parser = "qwen3_coder"
reasoning_parser = "qwen3"

[chat_template_kwargs]
reasoning_effort = "medium"

[[models]]
id = "qwen3-0.6b"
model = "qwen3-0.6b"
preload = true

[specs]
auto_update = true
update_hours = 24
data_dir = "/var/lib/inference-bench"
folders = ["/etc/inference-bench/specs"]

[runtime]
graphs = true
fuse = true
tile = "auto"
gemm_fp32 = false
