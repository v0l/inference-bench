[workspace]
members = ["crates/core", "crates/cli", "crates/ui", "crates/specrt"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/inference-bench"
description = "Compare LLM inference backends on the same prompts: speed, time to first token, memory and logit accuracy"

[workspace.dependencies]
inference-bench-core = { path = "crates/core" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
