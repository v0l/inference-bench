[workspace]
members = ["crates/core", "crates/cli", "crates/ui", "crates/specrt", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/inference-bench"
description = "Run LLMs on a native CUDA engine, serve them, and benchmark them against other engines"

[workspace.dependencies]
inference-bench-core = { path = "crates/core" }
inference-bench-server = { path = "crates/server", default-features = false }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "registry", "std", "smallvec", "tracing-log"] }
ureq = { version = "3", features = ["json"] }

[patch.crates-io]
egui_bench = { git = "https://github.com/v0l/egui_bench", rev = "dae434d" }

[profile.dev.package.inference-bench-specrt]
opt-level = 3
